name: Library

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release'
        required: true
      release_name:
        description: 'Name of the release'
        required: true
      pdf_url:
        description: 'Direct URL to the PDF file'
        required: true
      output_name:
        description: 'Output filename (with .pdf extension)'
        required: true

env:
  TZ: Asia/Kolkata

permissions:
  contents: write

jobs:
  download_PDF:
    runs-on: ubuntu-latest

    steps:
      - name: Download PDF from Source
        run: |
          mkdir -p store
          cd store
          curl -L "${{ github.event.inputs.pdf_url }}" -o "${{ github.event.inputs.output_name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: "${{ github.event.inputs.tag_name }}"
          name: "${{ github.event.inputs.release_name }}"
          body: |
            Medicine books
          files: "store/${{ github.event.inputs.output_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
